name: Recover release

on:
  workflow_dispatch:
    inputs:
      release-version:
        required: true
        type: string
        description: 'Version from the original failed run, e.g. v1.0.7'
      release-base:
        required: true
        type: string
        description: 'Original full baseline SHA from the failed run summary'

permissions:
  contents: write
  actions: read

jobs:
  release:
    uses: ./.github/workflows/release-pipeline.yml
    with:
      publish-existing: true
      release-version: ${{ inputs.release-version }}
      release-base: ${{ inputs.release-base }}
