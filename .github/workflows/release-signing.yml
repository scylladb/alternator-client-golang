name: Release signing
on:
  pull_request:
    paths: ['scripts/release/**', '.github/workflows/*release*', 'Makefile']
  push:
    branches: [main]
    paths: ['scripts/release/**', '.github/workflows/*release*', 'Makefile']
permissions:
  contents: read
jobs:
  release-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-release-signing
