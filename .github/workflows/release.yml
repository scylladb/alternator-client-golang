name: Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Version to release, e.g. v1.1.0; leave empty for the next patch'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  release:
    uses: ./.github/workflows/release-pipeline.yml
    with:
      release-version: ${{ inputs.release-version }}
